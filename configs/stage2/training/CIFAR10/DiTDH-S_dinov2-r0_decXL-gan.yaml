# Stage 2 on CIFAR-10: DiT^DH-S (official DiTDH-S structure) on the DINOv2 R=0 latent [192, 8, 8], 10 classes.
# Stage 1 = ViT-XL decoder with GAN fine-tune (dinov2_decXL_gan_ft), latent normalized with stats/cifar10_dinov2_r0.
# Epochs / batch / eval interval are tentative (global batch 512 -> 97 steps/epoch).
stage_1:
  target: stage1.RAE
  params:
    encoder_cls: 'CifarDinoViT'
    encoder_config_path: 'unused'
    encoder_input_size: 32
    encoder_params:
      ckpt_path: 'pretrained_models/encoder_dinov2_vit_tiny4.pt'
      normalize: true
    decoder_config_path: 'configs/decoder/ViTXL'
    decoder_patch_size: 4
    pretrained_decoder_path: 'ckpts/stage1/dinov2_decXL_gan_ft/decoder_ema.pt'
    noise_tau: 0.
    reshape_to_2d: true
    normalization_stat_path: 'stats/cifar10_dinov2_r0/normalization_stats.pt'

stage_2:
  target: stage2.models.DDT.DiTwDDTHead
  params:
    input_size: 8
    patch_size: 1
    in_channels: 192
    hidden_size: [384, 2048]
    depth: [12, 2]
    num_heads: [6, 16]
    mlp_ratio: 4.0
    class_dropout_prob: 0.1
    num_classes: 10
    use_qknorm: false
    use_swiglu: true
    use_rope: true
    use_rmsnorm: true
    wo_shift: false
    use_pos_embed: true

transport:
  params:
    path_type: 'Linear'
    prediction: 'velocity'
    loss_weight: null
    time_dist_type: 'logit-normal_0_1'

sampler:
  mode: ODE
  params:
    sampling_method: 'euler'
    num_steps: 50
    atol: 1.0e-6
    rtol: 1.0e-3
    reverse: false

guidance:
  method: 'cfg'
  scale: 1.0
  t_min: 0.0
  t_max: 1.0

misc:
  latent_size: [192, 8, 8] # [C, H, W]
  num_classes: 10
  time_dist_shift_dim: 12288 # 8*8*192 -> shift sqrt(12288/4096) ~= 1.73
  time_dist_shift_base: 4096

eval:
  eval_interval: 48500 # = checkpoint_interval (500 epochs) * 97 steps; 10k samples (test labels) vs train 50k Inception stats
  eval_model: false
  data_path: 'data/cifar10/test'
  reference_npz_path: 'data/cifar10/train_fid_stats.npz'


training:
  epochs: 2000
  #batch_size: 32
  global_batch_size: 512
  grad_accum_steps: 1 # change according to your GPU memory
  ema_decay: 0.9995
  num_workers: 4
  log_interval: 100
  checkpoint_interval: 500   # = epochs / 4 -> 5 ckpts (ep 0, 500, 1000, 1500 + ep-last), ~3.1GB each
  sample_every: 9700
  clip_grad: 1.0
  global_seed: 42
  optimizer:
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    type: linear
    warmup_epochs: 40
    decay_end_epoch: 2000
    base_lr: 2.0e-4
    final_lr: 2.0e-5
    warmup_from_zero: false