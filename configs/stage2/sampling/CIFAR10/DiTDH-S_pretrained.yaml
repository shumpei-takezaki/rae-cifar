# Sampling with the released weights (download into pretrained_models/, see README).
# Same model as DiTDH-S_dinov2-r0_decXL-gan.yaml.
stage_1:
  target: stage1.RAE
  params:
    encoder_cls: 'CifarDinoViT'
    encoder_config_path: 'unused'
    encoder_input_size: 32
    encoder_params:
      ckpt_path: 'pretrained_models/encoder_dinov2_vit_tiny4.pt'
      normalize: true
    decoder_config_path: 'configs/decoder/ViTXL'
    decoder_patch_size: 4
    pretrained_decoder_path: 'pretrained_models/decoder_vitxl_gan.pt'
    noise_tau: 0.
    reshape_to_2d: true
    normalization_stat_path: 'pretrained_models/normalization_stats.pt'

stage_2:
  target: stage2.models.DDT.DiTwDDTHead
  params:
    input_size: 8
    patch_size: 1
    in_channels: 192
    hidden_size: [384, 2048]
    depth: [12, 2]
    num_heads: [6, 16]
    mlp_ratio: 4.0
    class_dropout_prob: 0.1
    num_classes: 10
    use_qknorm: false
    use_swiglu: true
    use_rope: true
    use_rmsnorm: true
    wo_shift: false
    use_pos_embed: true
  ckpt: 'pretrained_models/ditdh_s_ema.pt'

transport:
  params:
    path_type: 'Linear'
    prediction: 'velocity'
    loss_weight: null
    time_dist_type: 'logit-normal_0_1'

sampler:
  mode: ODE
  params:
    sampling_method: 'euler'
    num_steps: 50
    atol: 1.0e-6
    rtol: 1.0e-3
    reverse: false

guidance:
  method: 'cfg'
  scale: 1.0   # no CFG (FID 13.59 on 50k); CFG 3.0 was worse (23.50)
  t_min: 0.0
  t_max: 1.0

misc:
  latent_size: [192, 8, 8] # [C, H, W]
  num_classes: 10
  time_dist_shift_dim: 12288 # 8*8*192 -> shift sqrt(12288/4096) ~= 1.73
  time_dist_shift_base: 4096
