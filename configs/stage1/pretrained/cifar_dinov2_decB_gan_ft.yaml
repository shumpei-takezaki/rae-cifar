# Inference config for the GAN fine-tuned Stage 1 decoder (EMA decoder from ckpts/stage1/dinov2_decB_gan_ft/ep-last.pt).
stage_1:
  target: stage1.RAE
  params:
    encoder_cls: 'CifarDinoViT'
    encoder_config_path: 'unused'
    encoder_input_size: 32
    encoder_params:
      ckpt_path: 'pretrained_models/encoders/encoder_dinov2_vit_tiny4.pt'
      normalize: true
    decoder_config_path: 'configs/decoder/ViTB'
    decoder_patch_size: 4
    pretrained_decoder_path: 'pretrained_models/stage1/decoder_vitb_gan.pt'
    noise_tau: 0.
    reshape_to_2d: true
