# Inference config for experiment 10: XL decoder with GAN, trained without latent noise augmentation (EMA).
stage_1:
  target: stage1.RAE
  params:
    encoder_cls: 'CifarDinoViT'
    encoder_config_path: 'unused'
    encoder_input_size: 32
    encoder_params:
      ckpt_path: 'pretrained_models/encoders/encoder_dinov2_vit_tiny4.pt'
      normalize: true
    decoder_config_path: 'configs/decoder/ViTXL'
    decoder_patch_size: 4
    pretrained_decoder_path: 'pretrained_models/stage1/decoder_vitxl_gan_nonoise.pt'
    noise_tau: 0.
    reshape_to_2d: true
