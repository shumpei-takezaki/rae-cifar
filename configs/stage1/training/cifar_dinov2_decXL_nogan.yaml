# Stage 1 baseline WITHOUT GAN with a ViT-XL decoder (28 layers, width 1152). Otherwise the same as
# cifar_dinov2_decB_nogan.yaml. Run with --precision bf16 (fp32 is ~5x slower); grad checkpointing on the decoder.
stage_1:
  target: stage1.RAE
  params:
    encoder_cls: 'CifarDinoViT'
    encoder_config_path: 'unused'          # only read for HF encoders (pixel stats come from the encoder class)
    encoder_input_size: 32
    encoder_params:
      ckpt_path: 'pretrained_models/encoder_dinov2_vit_tiny4.pt'
      normalize: true
    decoder_config_path: 'configs/decoder/ViTXL'
    decoder_patch_size: 4
    noise_tau: 0.8 # training 0.8, at inference time always set to 0
    reshape_to_2d: true

training:
  epochs: 400
  ema_decay: 0.9978
  global_batch_size: 512
  num_workers: 4
  clip_grad: 0.0
  grad_checkpointing: true   # needed to fit ViT-XL at batch 512
  log_interval: 100
  checkpoint_interval: 100   # each ckpt holds model + EMA + AdamW (B 1.4GB, L 4.9GB, XL 6.7GB)
  sample_every: 2500
  optimizer:
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    type: cosine
    warmup_epochs: 25
    decay_end_epoch: 400
    base_lr: 2.0e-4
    final_lr: 2.0e-5
    warmup_from_zero: true

gan:
  disc:
    arch:
      dino_ckpt_path: 'models/discs/dino_vit_small_patch8_224.pth'
      ks: 9
      norm_type: 'bn'
      using_spec_norm: true
      recipe: 'S_8'
    optimizer:
      lr: 2.0e-4
      betas: [0.9, 0.95]
      weight_decay: 0.0
    scheduler:
      type: cosine
      warmup_epochs: 25
      decay_end_epoch: 400
      base_lr: 2.0e-4
      final_lr: 2.0e-5
      warmup_from_zero: true
    augment:
      prob: 1.0
      cutout: 0.0
  loss:
    disc_loss: hinge
    gen_loss: vanilla
    disc_weight: 0.0          # GAN off: no generator GAN loss and no discriminator updates
    perceptual_weight: 1.0
    disc_start: 200
    disc_upd_start: 150
    lpips_start: 0
    max_d_weight: 10000.0
    disc_updates: 1
