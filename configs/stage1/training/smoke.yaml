# Smoke test of cifar_dinov2_decB.yaml: 2 epochs, discriminator updates from epoch 0, GAN loss from epoch 1.
stage_1:
  target: stage1.RAE
  params:
    encoder_cls: 'CifarDinoViT'
    encoder_config_path: 'unused'          # only read for HF encoders (pixel stats come from the encoder class)
    encoder_input_size: 32
    encoder_params:
      ckpt_path: 'pretrained_models/encoder_dinov2_vit_tiny4.pt'
      normalize: true
    decoder_config_path: 'configs/decoder/ViTB'
    decoder_patch_size: 4
    noise_tau: 0.8 # training 0.8, at inference time always set to 0
    reshape_to_2d: true

training:
  epochs: 2
  ema_decay: 0.9978
  global_batch_size: 128   # 512 OOMs on one A100-40GB in the DINO discriminator (32px upsampled to 224px)
  num_workers: 4
  clip_grad: 0.0
  log_interval: 100
  checkpoint_interval: 1
  sample_every: 2500
  optimizer:
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    type: cosine
    warmup_epochs: 1
    decay_end_epoch: 2
    base_lr: 2.0e-4
    final_lr: 2.0e-5
    warmup_from_zero: true

gan:
  disc:
    arch:
      dino_ckpt_path: 'models/discs/dino_vit_small_patch8_224.pth'
      ks: 9
      norm_type: 'bn'
      using_spec_norm: true
      recipe: 'S_8'
    optimizer:
      lr: 2.0e-4
      betas: [0.9, 0.95]
      weight_decay: 0.0
    scheduler:
      type: cosine
      warmup_epochs: 1
      decay_end_epoch: 2
      base_lr: 2.0e-4
      final_lr: 2.0e-5
      warmup_from_zero: true
    augment:
      prob: 1.0
      cutout: 0.0
  loss:
    disc_loss: hinge
    gen_loss: vanilla
    disc_weight: 0.75
    perceptual_weight: 1.0
    disc_start: 1
    disc_upd_start: 0
    lpips_start: 0
    max_d_weight: 10000.0
    disc_updates: 1
